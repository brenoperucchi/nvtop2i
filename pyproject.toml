[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvtop2i"
version = "0.5.0"
description = "nvtop-style GPU monitor for the local machine and several hosts over SSH"
readme = "README.md"
license = "MIT"
requires-python = ">=3.7"
authors = [
    {name = "Breno Perucchi"},
]
keywords = ["gpu", "tpu", "monitor", "nvidia", "ssh", "nvtop", "tui", "nvidia-smi", "metax", "cloud-tpu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "paramiko>=2.0",
    "windows-curses; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=7"]

[project.scripts]
nvtop2i = "nvtop2i.cli:main"

[tool.setuptools.packages.find]
include = ["nvtop2i*"]

[project.urls]
Homepage = "https://github.com/brenoperucchi/nvtop2i"
Repository = "https://github.com/brenoperucchi/nvtop2i"
Issues = "https://github.com/brenoperucchi/nvtop2i/issues"
